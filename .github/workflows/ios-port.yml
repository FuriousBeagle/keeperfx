name: iOS port probe

on:
  push:
    branches: [ios-port]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-arm64:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache iOS dependency sources
        uses: actions/cache@v4
        with:
          path: build-ios/_deps
          key: ios-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/cmake/modules/DependenciesIOS.cmake') }}
          restore-keys: |
            ios-deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version

      - name: Configure iOS ARM64
        run: |
          cmake \
            -S . \
            -B build-ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DPACKAGE_SUFFIX=iOS

      - name: Build KeeperFX
        run: |
          cmake --build build-ios --config Release --target keeperfx -- -allowProvisioningUpdates NO
